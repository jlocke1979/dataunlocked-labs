<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Uplands website has moved</title>
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://theuplandspeoria.org/" />
  <link rel="canonical" href="https://theuplandspeoria.org/" />
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #173f35;
      background: #f6f1e8;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }

    main {
      max-width: 38rem;
      margin: 2rem;
      padding: 3rem;
      text-align: center;
      background: #fff;
      border: 1px solid rgba(23, 63, 53, 0.15);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(23, 63, 53, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
    }

    p {
      color: #545d58;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    a {
      color: #173f35;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p>The Uplands Residential Association</p>
    <h1>We’ve moved.</h1>
    <p>
      The current neighborhood website is
      <a href="https://theuplandspeoria.org/">theuplandspeoria.org</a>.
    </p>
  </main>
</body>
</html>
